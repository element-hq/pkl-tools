name: Tests

on:
  workflow_dispatch:
  
  push:
    branches: [ main ]
  
  pull_request:

jobs:
  tests:
    name: StaticCode
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Pkl
      run: brew install pkl

    - name: Check formatting
      run: pkl format --diff-name-only .

    - name: Run tests
      working-directory: staticcode
      run: pkl test
